name = "SDG"
defaultTargets = ["SDG"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
linter.flexible = true
linter.mathlibStandardSet = true
weak.linter.verbose.detectClassical = true
warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "SDG"
